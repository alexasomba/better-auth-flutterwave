  "vite-plus": 1.1.0
  "vitest": 5.0.3
  "wrangler": "^4.149.0"
  "zod": "^4.6.5"

# Only reviewed native install scripts may run. Unlisted dependency scripts fail closed.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 1440
overrides:
  axios: 1.20.0
  "nanoid@^3": 3.3.20
  "undici@^7": 7.30.0
  "undici@^8": 8.11.2
  sharp: 0.35.5
  source-map-js: 1.2.2
  brace-expansion: 5.0.12
  esbuild: 0.28.2
  fast-uri: 3.1.8
  "js-yaml@^3": 3.15.2
  "js-yaml@^4": 4.3.2
  joi: 17.13.8
  launch-editor: 2.14.2
  postcss: 8.5.29
  rollup: npm:@rollup/wasm-node@4.64.3
  seroval: 1.6.9
  shell-quote: 1.12.0
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# These exact releases are required by the requested latest dependency update.
minimumReleaseAgeExclude:
  # Exact releases required by the requested latest dependency update.
  - "@cloudflare/workers-types@5.20261009.1"
  - "@base-ui/react@1.9.0"
  - "@base-ui/utils@0.5.0"
  - "@cloudflare/vite-plugin@1.63.1"
  - "@rollup/wasm-node@4.64.3"
  - "miniflare@5.20261006.1-alpha"
  - "seroval@1.6.9"
  - "wrangler@4.149.0"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
