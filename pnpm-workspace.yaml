  "@types/node": "^22.20.5"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.2"
  "@vitest/coverage-v8": 5.0.3
  "@vitest/ui": 5.0.3
  "better-auth": "^1.7.7"
  "better-call": "^1.4.2"
  "class-variance-authority": "^0.7.1"
  "clsx": "^2.1.1"
  "jsdom": "^30.1.2"
  "publint": "^0.3.25"
  "react": "^19.3.0"
  "react-dom": "^19.3.0"
  "skills-npm": "^4.0.0"
  "tailwind-merge": "^3.7.0"
  "tailwindcss": "^4.3.3"
  "tsx": "^4.23.15"
