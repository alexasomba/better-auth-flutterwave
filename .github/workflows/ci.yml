name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      NPM_CONFIG_OPTIONAL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          standalone: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select matrix runtime for Vite+
        run: pnpm exec vp env pin ${{ matrix.node }} --target node-version --force

      - name: Check
        run: pnpm exec vp check

      - name: Test
        run: pnpm exec vp test

      - name: Build package
        run: pnpm exec vp pack

      - name: Inspect packed package manifest
        shell: bash
        run: |
          PACK_DIR="$RUNNER_TEMP/npm-pack"
          mkdir -p "$PACK_DIR"
          pnpm pack --pack-destination "$PACK_DIR"

          TARBALL="$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [[ -z "$TARBALL" ]]; then
            echo "::error ::pnpm pack did not produce a tarball."
            exit 1
          fi

          tar -xOf "$TARBALL" package/package.json > "$PACK_DIR/package.json"
          if grep -q "catalog:" "$PACK_DIR/package.json"; then
            echo "::error ::Packed package.json still contains catalog: specifiers."
            exit 1
          fi

          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (pkg.pnpm?.patchedDependencies || pkg.patchedDependencies) { console.error("::error ::Packed package.json contains publish-time patch metadata."); process.exit(1); }' "$PACK_DIR/package.json"
          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (pkg.devEngines?.packageManager) { console.error("::error ::Packed package.json contains devEngines.packageManager, which prevents npm trusted publishing."); process.exit(1); }' "$PACK_DIR/package.json"

      - name: Lint package metadata
        run: pnpm run lint:package

      - name: Lint package types
        run: pnpm run lint:types

      - name: TanStack example check
        run: pnpm --dir examples/tanstack run check:ci

      - name: TanStack persistent billing schema check
        run: pnpm --dir examples/tanstack run db:billing:check

      - name: TanStack example test
        run: pnpm --dir examples/tanstack run test

      - name: TanStack example build
        run: pnpm --dir examples/tanstack run build

      - name: TanStack example Wrangler dry-run
        run: pnpm --dir examples/tanstack run wrangler:dry-run

      - name: TanStack persistent billing build and dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm --dir examples/tanstack run build:billing
          pnpm --dir examples/tanstack run wrangler:dry-run
